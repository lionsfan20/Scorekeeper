<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night Scorekeeper v0.4</title>
<style>
body{font-family:Arial,sans-serif;max-width:750px;margin:auto;padding:12px}
h1{text-align:center}
.controls{margin-bottom:16px}
.player{border:1px solid #ccc;border-radius:12px;padding:12px;margin:12px 0}
.header{display:flex;justify-content:space-between;align-items:center}
.score{font-size:2rem;font-weight:bold}
.subtotal{font-size:1.2rem;margin:8px 0}
button{padding:12px;margin:4px;font-size:1rem;min-height:44px}
.primary{font-weight:bold}
.log{margin-top:8px;border-top:1px solid #ddd;padding-top:8px}
.hidden{display:none}
#saveStatus{margin-bottom:12px;font-size:.9rem}
</style>
</head>
<body>

<h1>Game Night Scorekeeper v0.4</h1>
<div id="saveStatus">Last Saved: Never</div>

<div class="controls">
<button id="addPlayerBtn">+ Add Player</button>
<button id="undoBtn">Undo Last Commit</button>
<button id="resetBtn">Reset Scores</button>
<button id="saveBtn">Save Now</button>
</div>

<div id="players"></div>

<script>
const STORAGE_KEY="gameNightScorekeeper_v04";

let state = loadGame() || {
  players:[{
    id:1,
    name:"Player 1",
    score:0,
    subtotal:0,
    log:[],
    historyOpen:false
  }],
  history:[],
  lastSaved:null
};

function saveGame(){
  state.lastSaved = new Date().toLocaleTimeString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  document.getElementById("saveStatus").textContent =
    "Last Saved: " + state.lastSaved;
}

function loadGame(){
  try{
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : null;
  }catch(e){
    return null;
  }
}

function render(){
  document.getElementById("saveStatus").textContent =
    "Last Saved: " + (state.lastSaved || "Never");

  const root=document.getElementById("players");
  root.innerHTML="";

  state.players.forEach(p=>{
    const card=document.createElement("div");
    card.className="player";

    card.innerHTML=`
      <div class="header">
        <strong>${p.name}</strong>
        <span>
          <button data-action="rename" data-id="${p.id}">✏️</button>
          <button data-action="delete" data-id="${p.id}">🗑️</button>
        </span>
      </div>

      <div class="score">Total: ${p.score}</div>
      <div class="subtotal">Current Turn: ${p.subtotal}</div>

      <div>
        <button data-action="add" data-id="${p.id}" data-value="1">+1</button>
        <button data-action="add" data-id="${p.id}" data-value="2">+2</button>
        <button data-action="add" data-id="${p.id}" data-value="3">+3</button>
        <button data-action="add" data-id="${p.id}" data-value="5">+5</button>
        <button data-action="add" data-id="${p.id}" data-value="-1">-1</button>
      </div>

      <div>
        <button data-action="custom" data-id="${p.id}">Custom</button>
        <button data-action="clear" data-id="${p.id}">Clear</button>
        <button class="primary" data-action="commit" data-id="${p.id}">Add To Score</button>
      </div>

      <div>
        <button data-action="history" data-id="${p.id}">
          ${p.historyOpen ? "▼ History" : "▶ History"}
        </button>
      </div>

      <div class="log ${p.historyOpen ? "" : "hidden"}">
        ${p.log.length ? p.log.slice().reverse().join("") : "<div>No history yet</div>"}
      </div>
    `;
    root.appendChild(card);
  });

  document.querySelectorAll("[data-action]").forEach(btn=>{
    btn.addEventListener("click", handleAction);
  });
}

function persistAndRender(){
  saveGame();
  render();
}

function handleAction(e){
  const action=e.target.dataset.action;
  const id=Number(e.target.dataset.id);
  const p=state.players.find(x=>x.id===id);

  if(action==="rename"){
    const n=prompt("Player name:", p.name);
    if(n) p.name=n;
  }

  if(action==="delete"){
    if(confirm("Delete " + p.name + "?")){
      state.players=state.players.filter(x=>x.id!==id);
    }
  }

  if(action==="add"){ p.subtotal += Number(e.target.dataset.value); }

  if(action==="custom"){
    const v=parseInt(prompt("Add amount to turn:"),10);
    if(!isNaN(v)) p.subtotal += v;
  }

  if(action==="clear"){ p.subtotal=0; }

  if(action==="commit" && p.subtotal!==0){
    p.score += p.subtotal;
    const sign=p.subtotal>0?"+":"";
    p.log.push("<div>"+new Date().toLocaleTimeString()+" : "+sign+p.subtotal+"</div>");
    state.history.push({id:p.id,value:p.subtotal});
    p.subtotal=0;
  }

  if(action==="history"){ p.historyOpen=!p.historyOpen; }

  persistAndRender();
}

document.getElementById("addPlayerBtn").addEventListener("click",()=>{
  const name=prompt("Enter player name:");
  if(!name) return;

  state.players.push({
    id:Date.now(),
    name,
    score:0,
    subtotal:0,
    log:[],
    historyOpen:false
  });

  persistAndRender();
});

document.getElementById("undoBtn").addEventListener("click",()=>{
  const last=state.history.pop();
  if(!last) return;

  const p=state.players.find(x=>x.id===last.id);
  if(!p) return;

  p.score -= last.value;
  p.log.push("<div>"+new Date().toLocaleTimeString()+" : UNDO "+last.value+"</div>");
  persistAndRender();
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Reset all scores and history?\n\nPlayers will remain in the game.")) return;

  state.players.forEach(p=>{
    p.score=0;
    p.subtotal=0;
    p.log=[];
    p.historyOpen=false;
  });

  state.history=[];
  persistAndRender();
});

document.getElementById("saveBtn").addEventListener("click",()=>{
  saveGame();
  render();
});

render();
saveGame();
</script>

</body>
</html>
