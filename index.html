<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night Scorekeeper v0.5.2</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:12px}
.banner,.player{border:1px solid #ccc;border-radius:12px;padding:12px;margin-bottom:12px}
.player{margin-top:12px}
.header{display:flex;justify-content:space-between;align-items:center}
.score{font-size:2rem;font-weight:bold}
.subtotal{margin:8px 0}
button{padding:10px 12px;margin:4px;min-height:44px}
.hidden{display:none}
.log{border-top:1px solid #ddd;padding-top:8px;margin-top:8px}
dialog{border-radius:12px;padding:16px;max-width:360px}
.small{font-size:.85rem;color:#555;margin-top:10px}
</style>
</head>
<body>
<h1>Game Night Scorekeeper v0.5.2</h1>

<div class="banner">
<div id="gameDisplay"></div>
<div id="scoringDisplay"></div>
<div id="playerCount"></div>
<div id="saveDisplay"></div>
</div>

<button id="addPlayerBtn">+ Add Player</button>
<button id="undoBtn">Undo</button>
<button id="resetBtn">Reset Scores</button>
<button id="settingsBtn">⚙️ Game Settings</button>

<div id="players"></div>

<dialog id="settingsDialog">
<h3>Game Settings</h3>

<label>Template</label><br>
<select id="templateSelect">
<option>Generic Counter</option>
</select>

<br><br>

<label><input type="radio" name="mode" value="up"> Count Up</label><br>
<label><input type="radio" name="mode" value="down"> Countdown</label>

<br><br>

<label>Starting Score
<input id="startingScoreInput" type="number" min="0">
</label>

<div style="margin-top:12px">
<button id="cancelSettingsBtn">Cancel</button>
<button id="saveSettingsBtn">Save Settings</button>
</div>

<div class="small">Game Night Scorekeeper v0.5.2</div>
</dialog>

<script>
const KEY="gameNightScorekeeper_v052";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 settings:{template:"generic-counter",scoringMode:"up",startingScore:100},
 players:[{id:1,name:"Player 1",score:0,subtotal:0,log:[],historyOpen:false}],
 history:[],
 lastSaved:null
};

function save(){state.lastSaved=new Date().toLocaleTimeString();localStorage.setItem(KEY,JSON.stringify(state));}
function startVal(){return state.settings.scoringMode==="down"?state.settings.startingScore:0;}
function persist(){save();render();}

function render(){
 gameDisplay.textContent="Game: Generic Counter";
 scoringDisplay.textContent=state.settings.scoringMode==="down" ?
   `Scoring: Countdown [${state.settings.startingScore}]` : "Scoring: Count Up";
 playerCount.textContent=`Players: ${state.players.length}`;
 saveDisplay.textContent=`Last Saved: ${state.lastSaved||"Never"}`;

 players.innerHTML="";
 state.players.forEach(p=>{
  const d=document.createElement("div");
  d.className="player";
  d.innerHTML=`
   <div class="header"><strong>${p.name}</strong>
   <span><button data-a="rename" data-id="${p.id}">✏️</button>
   <button data-a="delete" data-id="${p.id}">🗑️</button></span></div>
   <div class="score">Total: ${p.score}</div>
   <div class="subtotal">Current Turn: ${p.subtotal}</div>
   <button data-a="add" data-id="${p.id}" data-v="1">+1</button>
   <button data-a="add" data-id="${p.id}" data-v="2">+2</button>
   <button data-a="add" data-id="${p.id}" data-v="3">+3</button>
   <button data-a="add" data-id="${p.id}" data-v="5">+5</button>
   <button data-a="add" data-id="${p.id}" data-v="-1">-1</button><br>
   <button data-a="custom" data-id="${p.id}">Custom</button>
   <button data-a="clear" data-id="${p.id}">Clear</button>
   <button data-a="commit" data-id="${p.id}">Add To Score</button><br>
   <button data-a="history" data-id="${p.id}">${p.historyOpen?"▼":"▶"} History</button>
   <div class="log ${p.historyOpen?"":"hidden"}">${p.log.length?p.log.slice().reverse().join(""):"No history yet"}</div>`;
  players.appendChild(d);
 });
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=action);
}

function action(e){
 const a=e.target.dataset.a,id=Number(e.target.dataset.id);
 const p=state.players.find(x=>x.id===id);
 if(a==="rename"){let n=prompt("Player name:",p.name);if(n)p.name=n;}
 if(a==="delete"){if(confirm("Delete player?"))state.players=state.players.filter(x=>x.id!==id);}
 if(a==="add")p.subtotal+=Number(e.target.dataset.v);
 if(a==="custom"){let v=parseInt(prompt("Add amount:"),10);if(!isNaN(v))p.subtotal+=v;}
 if(a==="clear")p.subtotal=0;
 if(a==="commit"&&p.subtotal!==0){
   let v=p.subtotal;
   if(state.settings.scoringMode==="up") p.score+=v; else {p.score=Math.max(0,p.score-v); if(p.score===0) alert("🎉 "+p.name+" reached zero!");}
   p.log.push("<div>"+new Date().toLocaleTimeString()+" : "+(v>0?"+":"")+v+"</div>");
   state.history.push({id:p.id,value:v});
   p.subtotal=0;
 }
 if(a==="history")p.historyOpen=!p.historyOpen;
 persist();
}

addPlayerBtn.onclick=()=>{
 let n=prompt("Enter player name:");
 if(!n)return;
 state.players.push({id:Date.now(),name:n,score:startVal(),subtotal:0,log:[],historyOpen:false});
 persist();
};

undoBtn.onclick=()=>{
 let h=state.history.pop(); if(!h)return;
 let p=state.players.find(x=>x.id===h.id); if(!p)return;
 if(state.settings.scoringMode==="up") p.score-=h.value; else p.score+=h.value;
 p.log.push("<div>"+new Date().toLocaleTimeString()+" : UNDO "+h.value+"</div>");
 persist();
};

resetBtn.onclick=()=>{
 if(confirm("Reset all scores and history?")){
  state.players.forEach(p=>{p.score=startVal();p.subtotal=0;p.log=[];p.historyOpen=false;});
  state.history=[]; persist();
 }
};

settingsBtn.onclick=()=>{
 document.querySelector(`input[name="mode"][value="${state.settings.scoringMode}"]`).checked=true;
 startingScoreInput.value=state.settings.startingScore;
 settingsDialog.showModal();
 setTimeout(()=>document.getElementById("cancelSettingsBtn").focus(),0);
};

cancelSettingsBtn.onclick=()=>settingsDialog.close();

saveSettingsBtn.onclick=()=>{
 let mode=document.querySelector('input[name="mode"]:checked').value;
 let start=parseInt(startingScoreInput.value,10)||0;
 if(mode!==state.settings.scoringMode||start!==state.settings.startingScore){
   if(!confirm("Applying new settings will reset scores, history, and current turns. Continue?")) return;
   state.settings.scoringMode=mode;
   state.settings.startingScore=start;
   state.players.forEach(p=>{p.score=(mode==="down"?start:0);p.subtotal=0;p.log=[];p.historyOpen=false;});
   state.history=[];
 }
 persist();
 settingsDialog.close();
};

save(); render();
</script>
</body>
</html>
