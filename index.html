<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night Scorekeeper v0.4.1</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:auto;padding:12px}
.player{border:1px solid #ccc;border-radius:12px;padding:12px;margin:12px 0}
.header{display:flex;justify-content:space-between;align-items:center}
.score{font-size:2rem;font-weight:bold}
.subtotal{font-size:1.2rem;margin:8px 0}
button{padding:12px;margin:4px;min-height:44px}
.settings{border:1px solid #ccc;border-radius:12px;padding:12px;margin-bottom:16px}
.log{margin-top:8px;border-top:1px solid #ddd;padding-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<h1>Game Night Scorekeeper v0.4.1</h1>

<div id="saveStatus">Last Saved: Never</div>

<div class="settings">
<h3>Game Settings</h3>
<label><input type="radio" name="mode" value="up"> Count Up</label>
<label><input type="radio" name="mode" value="down"> Countdown</label>
<br><br>
<label>Starting Score:
<input id="startingScore" type="number" value="100" style="width:90px">
</label>
<button id="applySettings">Apply To New Players</button>
</div>

<button id="addPlayerBtn">+ Add Player</button>
<button id="undoBtn">Undo Last Commit</button>
<button id="resetBtn">Reset Scores</button>
<button id="saveBtn">Save Now</button>

<div id="players"></div>

<script>
const KEY="gameNightScorekeeper_v041";

let state=JSON.parse(localStorage.getItem(KEY) || "null") || {
 settings:{mode:"up",startingScore:100},
 players:[{id:1,name:"Player 1",score:0,subtotal:0,log:[],historyOpen:false}],
 history:[],
 lastSaved:null
};

function save(){
 state.lastSaved=new Date().toLocaleTimeString();
 localStorage.setItem(KEY,JSON.stringify(state));
}

function persistRender(){ save(); render(); }

function render(){
 document.getElementById('saveStatus').textContent="Last Saved: "+(state.lastSaved||"Never");

 document.querySelector(`input[name="mode"][value="${state.settings.mode}"]`).checked=true;
 document.getElementById('startingScore').value=state.settings.startingScore;

 const root=document.getElementById('players');
 root.innerHTML='';

 state.players.forEach(p=>{
  const card=document.createElement('div');
  card.className='player';

  card.innerHTML=`
  <div class="header">
    <strong>${p.name}</strong>
    <span>
      <button data-a="rename" data-id="${p.id}">✏️</button>
      <button data-a="delete" data-id="${p.id}">🗑️</button>
    </span>
  </div>
  <div class="score">Total: ${p.score}</div>
  <div class="subtotal">Current Turn: ${p.subtotal}</div>

  <button data-a="add" data-id="${p.id}" data-v="1">+1</button>
  <button data-a="add" data-id="${p.id}" data-v="2">+2</button>
  <button data-a="add" data-id="${p.id}" data-v="3">+3</button>
  <button data-a="add" data-id="${p.id}" data-v="5">+5</button>
  <button data-a="add" data-id="${p.id}" data-v="-1">-1</button>

  <div>
    <button data-a="custom" data-id="${p.id}">Custom</button>
    <button data-a="clear" data-id="${p.id}">Clear</button>
    <button data-a="commit" data-id="${p.id}">Add To Score</button>
  </div>

  <button data-a="history" data-id="${p.id}">${p.historyOpen?"▼":"▶"} History</button>

  <div class="log ${p.historyOpen?"":"hidden"}">
   ${p.log.length?p.log.slice().reverse().join(""):"<div>No history yet</div>"}
  </div>
  `;
  root.appendChild(card);
 });

 document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',action));
}

function action(e){
 const a=e.target.dataset.a;
 const id=Number(e.target.dataset.id);
 const p=state.players.find(x=>x.id===id);

 if(a==="rename"){ const n=prompt("Player name:",p.name); if(n)p.name=n; }
 if(a==="delete"){ if(confirm("Delete "+p.name+"?")) state.players=state.players.filter(x=>x.id!==id); }
 if(a==="add"){ p.subtotal+=Number(e.target.dataset.v); }
 if(a==="custom"){ let v=parseInt(prompt("Add amount:"),10); if(!isNaN(v)) p.subtotal+=v; }
 if(a==="clear"){ p.subtotal=0; }

 if(a==="commit" && p.subtotal!==0){
   const applied = p.subtotal;
   if(state.settings.mode==="up"){
      p.score += applied;
   } else {
      p.score -= applied;
      if(p.score <= 0){
        p.score = 0;
        alert("🎉 "+p.name+" reached zero!");
      }
   }
   p.log.push("<div>"+new Date().toLocaleTimeString()+" : "+(applied>0?"+":"")+applied+"</div>");
   state.history.push({id:p.id,value:applied});
   p.subtotal=0;
 }

 if(a==="history"){ p.historyOpen=!p.historyOpen; }

 persistRender();
}

document.getElementById('applySettings').addEventListener('click',()=>{
 state.settings.mode=document.querySelector('input[name="mode"]:checked').value;
 state.settings.startingScore=parseInt(document.getElementById('startingScore').value,10)||0;
 persistRender();
});

document.getElementById('addPlayerBtn').addEventListener('click',()=>{
 const n=prompt("Enter player name:");
 if(!n) return;

 const start = state.settings.mode==="down" ? state.settings.startingScore : 0;

 state.players.push({
   id:Date.now(),name:n,score:start,subtotal:0,log:[],historyOpen:false
 });
 persistRender();
});

document.getElementById('undoBtn').addEventListener('click',()=>{
 const last=state.history.pop(); if(!last) return;
 const p=state.players.find(x=>x.id===last.id); if(!p) return;

 if(state.settings.mode==="up") p.score-=last.value;
 else p.score+=last.value;

 p.log.push("<div>"+new Date().toLocaleTimeString()+" : UNDO "+last.value+"</div>");
 persistRender();
});

document.getElementById('resetBtn').addEventListener('click',()=>{
 if(!confirm("Reset scores and history?")) return;

 const start = state.settings.mode==="down" ? state.settings.startingScore : 0;

 state.players.forEach(p=>{
   p.score=start;
   p.subtotal=0;
   p.log=[];
   p.historyOpen=false;
 });

 state.history=[];
 persistRender();
});

document.getElementById('saveBtn').addEventListener('click',()=>{
 save(); render();
});

render();
save();
</script>
</body>
</html>
